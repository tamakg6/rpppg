<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Whipper風 放置RPG v7</title>
<style>
:root{
  --bg:#14151a;--panel:#1e2027;--panel2:#262833;--border:#34363f;
  --text:#e8e8ec;--dim:#9a9ba5;--accent:#7c6df0;--acc2:#4a3fa0;
  --danger:#e0556a;--warn:#d8a73f;--safe:#4caf7c;--gold:#d8b34a;
  --rw:#cfd2da;--rb:#5b8fd8;--ry:#d8c23f;--rr:#d85f5f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;font-size:14px;padding-bottom:70px;}
.topbar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
.bp-pill{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--gold);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--gold);font-weight:600;}
.screen{padding:14px;max-width:720px;margin:0 auto;}
.hidden{display:none!important;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.dim{color:var(--dim);font-size:12px;}
button{background:var(--acc2);color:var(--text);border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;}
button:disabled{opacity:.4;cursor:not-allowed;}
button.sec{background:var(--panel2);border:1px solid var(--border);}
button.sm{padding:4px 10px;font-size:12px;}
button.gold{background:linear-gradient(180deg,#d8b34a,#a4801f);color:#1a1300;font-weight:600;}
button.full{width:100%;}
button.danger-btn{background:#5a2230;}
.dng-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:8px;}
.dng-item:active{border-color:var(--accent);}
.dl{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.ds{background:rgba(76,175,124,.15);color:var(--safe);}
.dc{background:rgba(216,167,63,.15);color:var(--warn);}
.dd{background:rgba(224,85,106,.15);color:var(--danger);}
.dsu{background:rgba(224,85,106,.3);color:#ff7a8e;}
.log-entry{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;cursor:pointer;}
.log-entry .t{color:var(--dim);margin-right:6px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);display:flex;z-index:10;}
.tabbar button{flex:1;background:none;border-radius:0;padding:10px 4px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:2px;align-items:center;}
.tabbar button.active{color:var(--accent);}
.icard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.icard.eq{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.icard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.iname{font-weight:600;}
.rw{color:var(--rw);}.rb{color:var(--rb);}.ry{color:var(--ry);}.rr{color:var(--rr);}
.abtag{display:inline-block;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;margin:2px 3px 0 0;color:var(--dim);}
.abtag.rare{color:var(--gold);border-color:var(--gold);}
.cbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(216,179,74,.15);color:var(--gold);margin-left:4px;}
.segctrl{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:3px;margin-bottom:10px;}
.segctrl button{flex:1;background:none;border-radius:6px;padding:6px;font-size:12px;color:var(--dim);}
.segctrl button.active{background:var(--acc2);color:var(--text);}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
.mat-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;}
.mat-card .cnt{font-size:12px;color:var(--gold);font-weight:600;}
.pb-bg{background:var(--panel2);border-radius:20px;height:10px;overflow:hidden;}
.pb-fill{background:var(--accent);height:100%;transition:width .3s;}
.eb-bg{background:var(--panel2);border-radius:6px;height:18px;overflow:hidden;position:relative;}
.eb-fill{background:linear-gradient(90deg,var(--acc2),var(--accent));height:100%;}
.eb-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.xb-bg{background:var(--panel2);border-radius:6px;height:10px;overflow:hidden;}
.xb-fill{background:linear-gradient(90deg,#7c6df0,#b8aaff);height:100%;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:16px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;}
.modal.ctr{border-radius:12px;max-width:480px;margin:auto;}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:0;background:var(--panel);padding-bottom:6px;z-index:1;}
.cx{font-size:20px;color:var(--dim);cursor:pointer;padding:4px 8px;}
.stbl{width:100%;font-size:12.5px;border-collapse:collapse;}
.stbl th,.stbl td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--border);}
.stbl th:first-child,.stbl td:first-child{text-align:left;}
.flash-ev{animation:fgold 1.2s ease;}
@keyframes fgold{0%{box-shadow:0 0 0 0 rgba(216,179,74,.8);}100%{box-shadow:0 0 0 12px rgba(216,179,74,0);}}
.rt{font-size:13px;color:var(--gold);font-weight:600;margin:4px 0 8px;}
select,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;}
input[type=number]{width:80px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#7c6df0;color:#fff;padding:8px 16px;border-radius:20px;z-index:100;font-size:13px;pointer-events:none;opacity:0;transition:opacity .4s;}
.inner-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px;gap:0;}
.inner-tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;background:none;border-radius:0;}
.inner-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.reward-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(216,179,74,.15);color:var(--gold);margin-left:6px;}
.analysis-screen{padding:0;}
.coll-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.exp-mini{height:3px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:3px 0;}
.exp-mini-fill{height:100%;background:var(--accent);}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div style="font-weight:600;">冒険者</div>
    <span class="bp-pill">BP <span id="topBP">0</span></span>
  </div>
  <div style="text-align:right;">
    <div class="dim">強さレーティング</div>
    <div style="font-weight:600;color:var(--gold);" id="topRating">0</div>
  </div>
</div>

<!-- DUNGEON -->
<div class="screen" id="screen-dungeon">
  <div id="wlArea"></div>
  <div class="card hidden" id="explorePanel">
    <h3 id="expDngName"></h3>
    <div class="pb-bg" style="margin-bottom:6px;"><div class="pb-fill" id="expProg" style="width:0%;"></div></div>
    <div class="row" style="margin-bottom:2px;">
      <span class="dim" id="expStatus">準備中</span>
      <span class="dim" id="expFloor"></span>
    </div>
    <div class="rt" id="expReturnTime"></div>
    <button class="sec sm" id="btnRetreat">途中帰還</button>
    <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:8px;">
      <div class="dim" style="font-size:11px;margin-bottom:6px;">探索ログ（タップで詳細）</div>
      <div id="curExpLog"></div>
    </div>
  </div>
  <div class="card" id="dngListCard">
    <h3>ダンジョンを選択</h3>
    <div id="dngList"></div>
  </div>
</div>

<!-- LOG -->
<div class="screen hidden" id="screen-log">
  <div class="card">
    <h3>探索の記録（直近10件）</h3>
    <div id="logList"></div>
  </div>
</div>

<!-- ITEM -->
<div class="screen hidden" id="screen-item">
  <div class="card">
    <div class="row" style="margin-bottom:10px;">
      <h3 style="margin:0;">所持装備</h3>
      <div style="display:flex;gap:6px;">
        <button class="sm sec" id="btnOpenCollection">📖 アイテム図鑑</button>
        <button class="sm sec" id="btnOpenAnalysis">🔬 解析</button>
      </div>
    </div>
    <div class="segctrl" id="itemTabs">
      <button class="active" data-cat="weapon">武器</button>
      <button data-cat="shield">盾</button>
      <button data-cat="ring">指輪</button>
    </div>
    <div id="itemList"></div>
  </div>
  <div class="card">
    <h3>強化素材</h3>
    <div class="mat-grid" id="matGrid"></div>
  </div>
</div>

<!-- STATUS -->
<div class="screen hidden" id="screen-status">
  <div class="inner-tabs">
    <button class="inner-tab active" data-stab="stats">ステータス</button>
    <button class="inner-tab" data-stab="boost">永続ブースト</button>
    <button class="inner-tab" data-stab="record">冒険記録</button>
  </div>
  <div id="stab-stats">
    <div class="card">
      <h3>現在の装備</h3>
      <div id="equippedList"></div>
    </div>
    <div class="card">
      <h3>ステータス詳細</h3>
      <table class="stbl" id="statusTable"></table>
    </div>
    <div class="card">
      <h3>成長テーブル（Lv1〜50）</h3>
      <table class="stbl" id="growthTable"></table>
    </div>
  </div>
  <div id="stab-boost" class="hidden">
    <div class="card">
      <div class="row">
        <h3 style="margin:0;">永続ブースト</h3>
        <span class="bp-pill">BP <span id="bpAvail">0</span></span>
      </div>
      <p class="dim">解析Lvが5の倍数に達するとBP+1。ステータス強化または特殊能力固定化（50BP）に使用。</p>
      <div id="boostList"></div>
      <hr style="border-color:var(--border);margin:12px 0;">
      <div id="rareUnlockList"></div>
    </div>
  </div>
  <div id="stab-record" class="hidden">
    <div class="card">
      <h3>冒険記録</h3>
      <div id="recordList"></div>
    </div>
  </div>
</div>

<div class="tabbar">
  <button class="tab-btn active" data-screen="dungeon">⛰<span>DUNGEON</span></button>
  <button class="tab-btn" data-screen="log">📜<span>LOG</span></button>
  <button class="tab-btn" data-screen="item">🎒<span>ITEM</span></button>
  <button class="tab-btn" data-screen="status">👤<span>STATUS</span></button>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>
